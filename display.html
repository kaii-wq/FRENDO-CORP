  <!-- 4. JAVASCRIPT LOGIC -->
  <script>
    const ROOT_REF_PATH = 'tefa_songsong';
    const LOCAL_STORAGE_KEY = 'tefa_songsong_v1_data';

    const SCHEDULE_DAYS = [
      { id: '2026-11-23', short: '23 Nov', full: '23 NOV 2026' },
      { id: '2026-11-24', short: '24 Nov', full: '24 NOV 2026' },
      { id: '2026-11-26', short: '26 Nov', full: '26 NOV 2026' },
      { id: '2026-11-27', short: '27 Nov', full: '27 NOV 2026' },
    ];

    const ALL_35_PINS = [
      '1001', '1002', '1003', '1004', '1005', '1006',
      '1007', '1008', '1009', '1010', '1011', '1012',
      '2001', '2002', '2003', '2004', '2005', '2006',
      '2007', '2008', '2009', '2010', '2011', '2012',
      '2013', '2014', '2015', '2016', '2017', '2018',
      '2019', '2020', '2021', '2022', '2023',
    ];

    const WORKERS_MASTER = [
      { index: 0, presensi: 13, name: 'Rhino', pin: '2001' },
      { index: 1, presensi: 14, name: 'Redi', pin: '2002' },
      { index: 2, presensi: 15, name: 'Rafa', pin: '2003' },
      { index: 3, presensi: 16, name: 'Aqim', pin: '2004' },
      { index: 4, presensi: 17, name: 'Raihan', pin: '2005' },
      { index: 5, presensi: 18, name: 'Fajar', pin: '2006' },
      { index: 6, presensi: 19, name: 'Embun', pin: '2007' },
      { index: 7, presensi: 20, name: 'Nazwa', pin: '2008' },
      { index: 8, presensi: 21, name: 'Dea', pin: '2009' },
      { index: 9, presensi: 22, name: 'Alvi', pin: '2010' },
      { index: 10, presensi: 23, name: 'Ziva', pin: '2011' },
      { index: 11, presensi: 24, name: 'Cyrilla', pin: '2012' },
      { index: 12, presensi: 25, name: 'Neysa', pin: '2013' },
      { index: 13, presensi: 26, name: 'Akmal', pin: '2014' },
      { index: 14, presensi: 27, name: 'Milo', pin: '2015' },
      { index: 15, presensi: 28, name: 'Tegar', pin: '2016' },
      { index: 16, presensi: 29, name: 'Vika', pin: '2017' },
      { index: 17, presensi: 30, name: 'Aul', pin: '2018' },
      { index: 18, presensi: 31, name: 'Ilham Daniswara', pin: '2019' },
      { index: 19, presensi: 32, name: 'Ilham Bayu', pin: '2020' },
      { index: 20, presensi: 33, name: 'Damar', pin: '2021' },
      { index: 21, presensi: 34, name: 'Sakti', pin: '2022' },
      { index: 22, presensi: 35, name: 'Hafidz', pin: '2023' },
    ];

    let activeDateId = SCHEDULE_DAYS[0].id;
    let displayMode = 'daily';
    let prevHeroLolos = null;
    let prevWorkerRejectMap = null;
    let flashTimeout = null;
    let rejectSidebarTimeout = null;
    let rejectCountdownInterval = null;
    let wakeLock = null;

    function createDefaultDay() {
      const workers = {};
      WORKERS_MASTER.forEach((w) => {
        workers[String(w.index)] = { lolos: 0, reject: 0 };
      });
      const attendance = {};
      ALL_35_PINS.forEach((pin) => {
        attendance[pin] = 'Hadir';
      });
      return {
        jamMulai: '07:30',
        jamSelesai: '15:00',
        packingVerified: 0,
        attendance,
        workers,
      };
    }

    function createDefaultState() {
      const days = {};
      SCHEDULE_DAYS.forEach((d) => {
        days[d.id] = createDefaultDay();
      });
      return {
        meta: {
          kelas: 'X TE 2',
          ruang: 'Ruang 84',
          targetHarianKelas: 230,
        },
        days,
      };
    }

    function normalizeState(raw) {
      const base = createDefaultState();
      if (!raw || typeof raw !== 'object') return base;

      base.meta = {
        kelas: raw.meta?.kelas || 'X TE 2',
        ruang: raw.meta?.ruang || 'Ruang 84',
        targetHarianKelas: Number(raw.meta?.targetHarianKelas) > 0 ? Number(raw.meta.targetHarianKelas) : 230,
      };

      SCHEDULE_DAYS.forEach((d) => {
        const dRaw = raw.days?.[d.id] || {};
        const dDef = createDefaultDay();

        const attendance = { ...dDef.attendance };
        if (dRaw.attendance && typeof dRaw.attendance === 'object') {
          Object.keys(attendance).forEach((pin) => {
            if (dRaw.attendance[pin]) attendance[pin] = dRaw.attendance[pin];
          });
        }

        const workers = { ...dDef.workers };
        if (dRaw.workers && typeof dRaw.workers === 'object') {
          WORKERS_MASTER.forEach((w) => {
            const k = String(w.index);
            const entry =
              dRaw.workers[k] ||
              dRaw.workers[w.index] ||
              dRaw.workers[w.pin] ||
              dRaw.workers[w.name] ||
              {};
            workers[k] = {
              lolos: Math.max(0, Number(entry.lolos) || 0),
              reject: Math.max(0, Number(entry.reject) || 0),
            };
          });
        }

        base.days[d.id] = {
          jamMulai: dRaw.jamMulai || '07:30',
          jamSelesai: dRaw.jamSelesai || '15:00',
          packingVerified: Math.max(0, Number(dRaw.packingVerified) || 0),
          attendance,
          workers,
        };
      });

      return base;
    }

    let boardState = normalizeState(
      (() => {
        try {
          const s = localStorage.getItem(LOCAL_STORAGE_KEY);
          return s ? JSON.parse(s) : null;
        } catch (_) {
          return null;
        }
      })()
    );

    function isPlaceholderConfig(cfg) {
      if (!cfg || !cfg.apiKey || !cfg.databaseURL) return true;
      return (
        cfg.apiKey.includes('YOUR_') ||
        cfg.databaseURL.includes('YOUR_') ||
        cfg.projectId?.includes('YOUR_')
      );
    }

    function setLiveIndicator(live) {
      const dot = document.getElementById('live-dot');
      if (!dot) return;
      dot.className = live
        ? 'w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]'
        : 'w-3 h-3 rounded-full bg-amber-400';
    }

    function initRealtimeBoard() {
      if (!isPlaceholderConfig(firebaseConfig) && typeof firebase !== 'undefined') {
        try {
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          const ref = firebase.database().ref(ROOT_REF_PATH);
          setLiveIndicator(true);

          ref.on(
            'value',
            (snapshot) => {
              const val = snapshot.val();
              if (val) {
                boardState = normalizeState(val);
                try {
                  localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(boardState));
                } catch (_) {}
              }
              renderBoard();
            },
            () => {
              setLiveIndicator(false);
              renderBoard();
            }
          );
          return;
        } catch (_) {}
      }

      setLiveIndicator(false);
      renderBoard();
    }

    window.addEventListener('storage', (e) => {
      if (e.key === LOCAL_STORAGE_KEY && e.newValue) {
        try {
          boardState = normalizeState(JSON.parse(e.newValue));
          renderBoard();
        } catch (_) {}
      }
    });

    function extractWorkerRawEntry(workersObj, worker) {
      if (!workersObj || typeof workersObj !== 'object') return { lolos: 0, reject: 0 };
      const entry =
        workersObj[String(worker.index)] ||
        workersObj[worker.index] ||
        workersObj[worker.pin] ||
        workersObj[worker.name] ||
        {};
      return {
        lolos: Math.max(0, Number(entry.lolos) || 0),
        reject: Math.max(0, Number(entry.reject) || 0),
      };
    }

    function getAggregatedData() {
      const targetDaily = Number(boardState.meta.targetHarianKelas) || 230;

      if (displayMode === 'daily') {
        const day = boardState.days[activeDateId] || createDefaultDay();
        let totalLolos = 0;
        let totalReject = 0;

        const workerStats = WORKERS_MASTER.map((w) => {
          const raw = extractWorkerRawEntry(day.workers, w);
          totalLolos += raw.lolos;
          totalReject += raw.reject;
          return { ...w, lolos: raw.lolos, reject: raw.reject };
        });

        let hadirCount = 0;
        ALL_35_PINS.forEach((pin) => {
          if ((day.attendance?.[pin] || 'Hadir') === 'Hadir') hadirCount += 1;
        });

        const activeDayObj = SCHEDULE_DAYS.find((x) => x.id === activeDateId) || SCHEDULE_DAYS[0];

        return {
          scopeText: activeDayObj.full,
          progressTitle: 'Target Harian',
          targetGoal: targetDaily,
          totalLolos,
          totalReject,
          hadirCount,
          workerStats,
        };
      }

      let totalLolos = 0;
      let totalReject = 0;
      const accMap = WORKERS_MASTER.map((w) => ({ ...w, lolos: 0, reject: 0 }));

      let hadirSum = 0;
      SCHEDULE_DAYS.forEach((d) => {
        const day = boardState.days[d.id] || createDefaultDay();
        WORKERS_MASTER.forEach((w, idx) => {
          const raw = extractWorkerRawEntry(day.workers, w);
          accMap[idx].lolos += raw.lolos;
          accMap[idx].reject += raw.reject;
          totalLolos += raw.lolos;
          totalReject += raw.reject;
        });
        ALL_35_PINS.forEach((pin) => {
          if ((day.attendance?.[pin] || 'Hadir') === 'Hadir') hadirSum += 1;
        });
      });

      const avgHadir = Math.round(hadirSum / SCHEDULE_DAYS.length);

      return {
        scopeText: 'KUMULATIF 4 HARI',
        progressTitle: 'Target 4 Hari',
        targetGoal: targetDaily * 4,
        totalLolos,
        totalReject,
        hadirCount: avgHadir,
        workerStats: accMap,
      };
    }

    function getKonversiNilai(lolos, reject) {
      const l = Number(lolos) || 0;
      const r = Number(reject) || 0;

      if (l < 10) return { label: 'Belum KKM', cls: 'bg-slate-800 text-slate-300' };
      if (l > 10 && r === 0) return { label: 'Nilai 100', cls: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' };
      if (l > 10 && r > 0) return { label: 'Nilai 96', cls: 'bg-sky-500/20 text-sky-300 border border-sky-500/40' };
      if (l === 10 && r === 0) return { label: 'Nilai 86', cls: 'bg-teal-500/20 text-teal-300 border border-teal-500/40' };
      return { label: 'Nilai 76', cls: 'bg-amber-500/20 text-amber-300 border border-amber-500/40' };
    }

    /* NOTIFIKASI SIDEBAR RAMPING DENGAN ANIMASI SLIDE IN & SLIDE OUT */
    function triggerRejectSidebar(newlyRejectedWorkers) {
      const sidebar = document.getElementById('reject-alert-sidebar');
      const listEl = document.getElementById('reject-alert-list');
      const timerEl = document.getElementById('reject-alert-timer');
      if (!sidebar || !listEl) return;

      listEl.innerHTML = newlyRejectedWorkers
        .map(
          (w) => `
          <div class="rounded-xl bg-rose-500/15 border border-rose-500/40 px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="text-base sm:text-lg font-extrabold text-white truncate">
                #${w.presensi} ${w.name}
              </div>
              <div class="text-xs font-mono-num text-rose-300 mt-0.5">
                Total Reject: ${w.totalReject} pcs
              </div>
            </div>
            <div class="shrink-0 px-3 py-1.5 rounded-xl bg-rose-600 text-white font-mono-num font-extrabold text-base sm:text-lg">
              +${w.added}
            </div>
          </div>
        `
        )
        .join('');

      sidebar.classList.add('sidebar-open');

      if (typeof lucide !== 'undefined') lucide.createIcons();

      if (rejectSidebarTimeout) clearTimeout(rejectSidebarTimeout);
      if (rejectCountdownInterval) clearInterval(rejectCountdownInterval);

      let secondsLeft = 8;
      if (timerEl) timerEl.textContent = `${secondsLeft}d`;

      rejectCountdownInterval = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft > 0 && timerEl) {
          timerEl.textContent = `${secondsLeft}d`;
        } else {
          clearInterval(rejectCountdownInterval);
        }
      }, 1000);

      rejectSidebarTimeout = setTimeout(() => {
        dismissRejectSidebar();
      }, 8000);
    }

    function dismissRejectSidebar() {
      const sidebar = document.getElementById('reject-alert-sidebar');
      if (sidebar) {
        sidebar.classList.remove('sidebar-open');
      }
      if (rejectSidebarTimeout) clearTimeout(rejectSidebarTimeout);
      if (rejectCountdownInterval) clearInterval(rejectCountdownInterval);
    }

    function renderBoard() {
      document.getElementById('header-kelas-ruang').textContent =
        `${boardState.meta.kelas} • ${boardState.meta.ruang}`;

      document.getElementById('projector-date-buttons').innerHTML = SCHEDULE_DAYS.map((d) => {
        const active = d.id === activeDateId && displayMode === 'daily';
        return `
          <button
            type="button"
            onclick="selectProjectorDate('${d.id}')"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-mono-num font-bold transition cursor-pointer ${
              active ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'
            }"
          >
            ${d.short}
          </button>
        `;
      }).join('');

      const dailyBtn = document.getElementById('mode-daily-btn');
      const cumBtn = document.getElementById('mode-cumulative-btn');
      if (displayMode === 'daily') {
        dailyBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition cursor-pointer bg-emerald-500 text-slate-950';
        cumBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer text-slate-400 hover:text-white';
      } else {
        cumBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition cursor-pointer bg-emerald-500 text-slate-950';
        dailyBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer text-slate-400 hover:text-white';
      }

      const agg = getAggregatedData();

      /* Deteksi kenaikan reject per siswa untuk memunculkan Sidebar Notifikasi */
      if (prevWorkerRejectMap !== null) {
        const newRejects = [];
        agg.workerStats.forEach((w) => {
          const oldRej = prevWorkerRejectMap[w.index] ?? 0;
          if (w.reject > oldRej) {
            newRejects.push({
              presensi: w.presensi,
              name: w.name,
              added: w.reject - oldRej,
              totalReject: w.reject,
            });
          }
        });
        if (newRejects.length > 0) {
          triggerRejectSidebar(newRejects);
        }
      }
      prevWorkerRejectMap = {};
      agg.workerStats.forEach((w) => {
        prevWorkerRejectMap[w.index] = w.reject;
      });

      /* Efek kilat saat angka lolos naik */
      const heroNumEl = document.getElementById('hero-lolos-number');
      const heroCardEl = document.getElementById('hero-lolos-card');
      const deltaBadge = document.getElementById('delta-lolos-badge');

      if (prevHeroLolos !== null && agg.totalLolos > prevHeroLolos) {
        const diff = agg.totalLolos - prevHeroLolos;
        deltaBadge.textContent = `+${diff} LOLOS`;
        deltaBadge.classList.remove('hidden');

        heroCardEl.classList.remove('hero-flash-active');
        void heroCardEl.offsetWidth;
        heroCardEl.classList.add('hero-flash-active');

        if (flashTimeout) clearTimeout(flashTimeout);
        flashTimeout = setTimeout(() => {
          deltaBadge.classList.add('hidden');
          heroCardEl.classList.remove('hero-flash-active');
        }, 1200);
      }
      prevHeroLolos = agg.totalLolos;

      heroNumEl.textContent = agg.totalLolos;
      document.getElementById('scope-label-badge').textContent = agg.scopeText;

      const pctTarget = agg.targetGoal > 0 ? Math.round((agg.totalLolos / agg.targetGoal) * 100) : 0;
      const barWidth = Math.min(100, pctTarget);
      document.getElementById('target-progress-title').textContent = agg.progressTitle;
      document.getElementById('target-progress-stats').textContent =
        `${agg.totalLolos} / ${agg.targetGoal} pcs (${pctTarget}%)`;
      document.getElementById('target-progress-bar').style.width = `${barWidth}%`;

      const totalProcessed = agg.totalLolos + agg.totalReject;
      const rejectRatio = totalProcessed > 0 ? ((agg.totalReject / totalProcessed) * 100).toFixed(1) : '0.0';
      document.getElementById('kpi-reject-val').textContent = agg.totalReject;
      document.getElementById('kpi-reject-ratio').textContent = `Rasio ${rejectRatio}%`;

      const ikatCount = Math.floor(agg.totalLolos / 5);
      const sisaPcs = agg.totalLolos % 5;
      document.getElementById('kpi-packing-ikat').textContent = `${ikatCount} Ikat`;
      document.getElementById('kpi-packing-sisa').textContent = `Sisa ${sisaPcs} pcs`;

      document.getElementById('kpi-attendance-val').textContent = `${agg.hadirCount} / 35`;

      /* Peringkat Top 3: Kosong di awal jika belum ada satupun anak dengan lolos > 0 */
      const activeProducers = agg.workerStats
        .filter((w) => w.lolos > 0)
        .sort((a, b) => b.lolos - a.lolos || a.reject - b.reject || a.index - b.index);

      const podiumContainer = document.getElementById('top3-podium-container');

      if (activeProducers.length === 0) {
        podiumContainer.innerHTML = `
          <div class="rounded-2xl bg-[#090D16] border border-dashed border-slate-800 p-8 text-center my-auto">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-800/70 text-slate-400 mb-3">
              <i data-lucide="hourglass" class="w-6 h-6"></i>
            </div>
            <div class="text-base sm:text-lg font-bold text-slate-300">
              Belum Ada Peringkat
            </div>
            <div class="text-xs sm:text-sm text-slate-500 mt-1">
              Menunggu data lolos QC pertama
            </div>
          </div>
        `;
      } else {
        const top3 = activeProducers.slice(0, 3);
        const rankStyles = [
          { badge: 'bg-amber-400 text-slate-950', border: 'border-amber-400/50', label: '#1' },
          { badge: 'bg-slate-300 text-slate-950', border: 'border-slate-500/50', label: '#2' },
          { badge: 'bg-orange-400 text-slate-950', border: 'border-orange-400/50', label: '#3' },
        ];

        podiumContainer.innerHTML = top3
          .map((w, idx) => {
            const konversi = getKonversiNilai(w.lolos, w.reject);
            const st = rankStyles[idx];

            return `
              <div class="rounded-2xl bg-[#090D16] border ${st.border} p-4 sm:p-5 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3.5 min-w-0">
                  <span class="w-10 h-10 rounded-xl font-mono-num font-extrabold text-base flex items-center justify-center shrink-0 ${st.badge}">
                    ${st.label}
                  </span>
                  <div class="min-w-0">
                    <div class="text-lg sm:text-xl font-extrabold text-white truncate">
                      #${w.presensi} ${w.name}
                    </div>
                    <div class="text-xs sm:text-sm font-mono-num text-slate-400 mt-0.5">
                      Reject: <span class="${w.reject > 0 ? 'text-rose-400 font-bold' : 'text-slate-400'}">${w.reject}</span>
                    </div>
                  </div>
                </div>

                <div class="text-right shrink-0">
                  <div class="text-2xl sm:text-3xl font-mono-num font-extrabold text-emerald-400">
                    ${w.lolos} <span class="text-xs sm:text-sm font-semibold text-slate-400">pcs</span>
                  </div>
                  <span class="inline-block mt-1 px-2.5 py-0.5 rounded-lg text-xs font-mono-num font-bold ${konversi.cls}">
                    ${konversi.label}
                  </span>
                </div>
              </div>
            `;
          })
          .join('');
      }

      /* Daftar Siswa dengan Reject */
      const rejectWorkers = agg.workerStats
        .filter((w) => w.reject > 0)
        .sort((a, b) => b.reject - a.reject || a.index - b.index);

      document.getElementById('reject-board-count').textContent = `${rejectWorkers.length} Siswa`;
      const rejectContainer = document.getElementById('reject-board-content');

      if (rejectWorkers.length === 0) {
        rejectContainer.innerHTML = `
          <div class="w-full py-3.5 px-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono-num font-bold text-sm sm:text-base text-center">
            0 Reject
          </div>
        `;
      } else {
        rejectContainer.innerHTML = rejectWorkers
          .map(
            (w) => `
            <span class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 font-mono-num font-bold text-xs sm:text-sm">
              <span class="w-2 h-2 rounded-full bg-rose-400"></span>
              <span>#${w.presensi} ${w.name} (${w.reject})</span>
            </span>
          `
          )
          .join('');
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function selectProjectorDate(dateId) {
      displayMode = 'daily';
      activeDateId = dateId;
      prevHeroLolos = null;
      prevWorkerRejectMap = null;
      dismissRejectSidebar();
      renderBoard();
    }

    function setDisplayMode(mode) {
      displayMode = mode;
      prevHeroLolos = null;
      prevWorkerRejectMap = null;
      dismissRejectSidebar();
      renderBoard();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    async function acquireWakeLock() {
      if ('wakeLock' in navigator && navigator.wakeLock?.request) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
        } catch (_) {}
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !wakeLock) acquireWakeLock();
    });

    function startLiveClock() {
      const clockEl = document.getElementById('live-clock');
      const tick = () => {
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      };
      tick();
      setInterval(tick, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      startLiveClock();
      acquireWakeLock();
      initRealtimeBoard();
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
